[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucb-project"
version = "0.1.0"
description = "Recency-aware UCB1-Tuned model selector for stock forecasting MLflow runs"
requires-python = ">=3.10"
dependencies = [
  "mlflow>=2.12",
  "gymnasium>=0.29",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "torch>=2.2"]
torch = ["torch>=2.2"]

[project.scripts]
ucb-select = "ucb_project.cli:main"
ucb-debug = "ucb_project.debug:main"

[tool.setuptools.packages.find]
where = ["src"]
