version: 1

disable_existing_loggers: false

formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout
  training_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: simple
    filename: logs/training.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

root:
  level: INFO
  handlers:
    - console
    - training_file

loggers:
  kedro:
    level: INFO
  mlops_kedro:
    level: DEBUG
  optuna:
    level: INFO
  mlforecast:
    level: INFO
  urllib3:
    level: WARNING
  git:
    level: WARNING
  kedro.framework.hooks.manager:
    level: WARNING
